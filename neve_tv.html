<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Batalha de Bolas de Neve ⛄❄️ - Arena Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #0a192f 0%, #02060d 95%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      border: 10px solid transparent;
      border-image: repeating-linear-gradient(45deg, #ffd700, #ffd700 20px, #c41e3a 20px, #c41e3a 40px) 10;
    }

    .pisca-pisca {
      width: 100%; display: flex; justify-content: space-around; padding: 4px 16px; z-index: 4; flex-shrink: 0;
    }
    .luz {
      width: 12px; height: 18px; border-radius: 50%;
      animation: piscar 0.8s infinite alternate;
    }
    .luz:nth-child(4n+1) { background: #ff2a2a; box-shadow: 0 0 14px #ff2a2a; }
    .luz:nth-child(4n+2) { background: #ffd700; box-shadow: 0 0 14px #ffd700; animation-delay: 0.2s; }
    .luz:nth-child(4n+3) { background: #2ecc71; box-shadow: 0 0 14px #2ecc71; animation-delay: 0.4s; }
    .luz:nth-child(4n+4) { background: #3498db; box-shadow: 0 0 14px #3498db; animation-delay: 0.6s; }

    @keyframes piscar {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    header { z-index: 4; width: 96%; flex-shrink: 0; }
    h1 { font-size: 1.4rem; color: #ffd700; text-shadow: 0 3px 10px rgba(0,0,0,0.9); letter-spacing: 1px; }

    /* Mortal Kombat style HUD Moderno */
    .hud-mk {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 6px;
      background: rgba(10, 25, 47, 0.9);
      padding: 8px 16px;
      border-radius: 16px;
      border: 2px solid #ffd700;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      gap: 12px;
    }

    .fighter-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,215,0,0.4);
    }

    .fighter-name { font-size: 0.85rem; font-weight: 900; color: #ffd700; margin-bottom: 3px; }
    .health-bar-container {
      width: 100%;
      height: 18px;
      background: #2a0808;
      border: 2px solid #fff;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
    }
    .health-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #c41e3a, #2ecc71);
      transition: width 0.2s ease-out;
    }
    .health-text {
      position: absolute;
      width: 100%;
      top: 0; left: 0;
      font-size: 0.7rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px #000;
      line-height: 14px;
    }

    /* Arena Container */
    #layout-arena {
      display: flex;
      flex-direction: column;
      width: 96vw;
      height: calc(100vh - 135px);
      margin: auto;
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    #container-canvas {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: 540px;
      border: 4px solid #ffd700;
      border-radius: 18px;
      overflow: hidden;
      background: #0d233a;
      box-shadow: 0 10px 35px rgba(0,0,0,0.9);
    }

    #canvas-jogo {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay Lobby & Podio */
    #overlay-tela {
      display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(6, 20, 35, 0.98); z-index: 30; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px; text-align: center;
      overflow-y: auto;
    }

    #overlay-tela h2 { font-size: 2.2rem; color: #ffd700; margin-bottom: 8px; text-shadow: 0 4px 12px rgba(0,0,0,0.8); }
    .sub-selecao { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 16px; max-width: 720px; }

    .seletor-modo {
      display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center;
    }
    .btn-modo {
      background: rgba(255,255,255,0.1); color: #fff; border: 2px solid #ffd700;
      padding: 8px 18px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 0.95rem;
      transition: 0.2s;
    }
    .btn-modo.ativo { background: #ffd700; color: #061826; transform: scale(1.05); }

    #painel-conexao {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 16px 24px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      max-width: 900px;
    }

    #qrcode-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    #lista-slots-lobby {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      min-width: 320px;
    }

    .slot-lobby {
      background: rgba(255,255,255,0.07);
      border: 2px dashed #64748b;
      border-radius: 12px;
      padding: 8px 12px;
      text-align: left;
    }
    .slot-lobby.pronto {
      border-style: solid;
      background: rgba(46, 204, 113, 0.16);
    }

    .btn-acao {
      background: #2ecc71; color: #fff; border: none; padding: 12px 34px;
      font-size: 1.15rem; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transition: transform 0.2s;
    }
    .btn-acao:hover { transform: scale(1.05); background: #27ae60; }
    .btn-acao:disabled { background: #475569; box-shadow: none; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

  <div class="pisca-pisca" id="luzes-topo"></div>

  <header>
    <h1>⛄ BATALHA DE BOLAS DE NEVE • ARENA PRO ❄️</h1>
    <div class="hud-mk" id="mk-hud-container"></div>
  </header>

  <div id="layout-arena">
    <div id="container-canvas">
      <canvas id="canvas-jogo" width="1100" height="540"></canvas>
    </div>
  </div>

  <div class="pisca-pisca" id="luzes-base"></div>

  <div id="overlay-tela">
    <h2 id="overlay-titulo">⛄ BATALHA DE BOLAS DE NEVE</h2>
    <p class="sub-selecao" id="overlay-sub">
      Mova seu personagem com o Joystick, mire com o Touchpad e atire! Escaneie o QR Code no celular:
    </p>

    <div class="seletor-modo" id="seletor-modo-box">
      <button class="btn-modo ativo" onclick="definirModo('ffa')">CADA UM POR SI (1-4 P)</button>
      <button class="btn-modo" onclick="definirModo('duplas')">MODO DUPLAS (2 ou 4 P)</button>
      <button class="btn-modo" onclick="definirModo('bot')">1 JOGADOR VS BOT 🤖</button>
    </div>

    <div id="painel-conexao">
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div id="qrcode-box"></div>
        <div id="link-controle" style="font-size:0.75rem; color:#ffd700; max-width:220px; word-break:break-all;">Gerando link...</div>
        <button onclick="copiarLink()" style="background:#3498db; color:#fff; border:none; padding:4px 10px; border-radius:8px; cursor:pointer; font-size:0.78rem; font-weight:bold;">
          📋 Copiar Link
        </button>
      </div>

      <div id="lista-slots-lobby"></div>
    </div>

    <div id="podio-resultado" style="display:none; margin-bottom: 16px; width: 90%; max-width: 800px;"></div>

    <button class="btn-acao" id="btn-iniciar" onclick="iniciarBatalha()" disabled>⏳ AGUARDANDO JOGADORES...</button>
  </div>

  <script>
    function criarLuzes(id) {
      const el = document.getElementById(id);
      for (let i = 0; i < 16; i++) {
        const l = document.createElement('div'); l.className = 'luz'; el.appendChild(l);
      }
    }
    criarLuzes('luzes-topo');
    criarLuzes('luzes-base');

    // Web Audio Synthesizer para Efeitos Sonoros Imersivos
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarSom(tipo) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const agora = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (tipo === 'atirar') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, agora);
        osc.frequency.exponentialRampToValueAtTime(150, agora + 0.15);
        gain.gain.setValueAtTime(0.25, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.18);
        osc.start(agora); osc.stop(agora + 0.18);
      } else if (tipo === 'acertar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, agora);
        osc.frequency.exponentialRampToValueAtTime(60, agora + 0.3);
        gain.gain.setValueAtTime(0.35, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.33);
        osc.start(agora); osc.stop(agora + 0.33);
      } else if (tipo === 'vitoria') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, agora);
        osc.frequency.setValueAtTime(659.25, agora + 0.15);
        osc.frequency.setValueAtTime(783.99, agora + 0.3);
        osc.frequency.setValueAtTime(1046.50, agora + 0.45);
        gain.gain.setValueAtTime(0.3, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.7);
        osc.start(agora); osc.stop(agora + 0.7);
      }
    }

    const CORES_JOGADORES = ['#ff2a2a', '#2ecc71', '#3498db', '#ffd700'];
    const ICONES_CHARS = ['🎅', '🤶', '🦌', '⛄', '🧝', '💚', '🐧', '🐻‍❄️'];

    let modoJogo = 'ffa';
    let qtdMaxJogadores = 4;
    let jogadoresConectados = []; // { slot, nome, icone, conn, x, y, vx, vy, vida, maxVida, aimX, aimY, isBot }
    let jogoAtivo = false;
    let bolasDeNeve = [];
    let particulasVFX = [];
    let neveFundo = [];

    // Flocos de neve no fundo da arena
    for(let i=0; i<40; i++) {
      neveFundo.push({
        x: Math.random() * 1100,
        y: Math.random() * 540,
        r: Math.random() * 3 + 1,
        speed: Math.random() * 1.5 + 0.5
      });
    }

    // Obstáculos Móveis (Dinâmicos para não travar o jogo)
    let obstaculos = [
      { x: 300, y: 150, vx: 0, vy: 1.5, r: 35, tipo: 'pinheiro', minY: 80, maxY: 380 },
      { x: 800, y: 400, vx: 1.5, vy: 0, r: 40, tipo: 'boneco', minX: 600, maxX: 980 },
      { x: 550, y: 270, vx: 1, vy: 1, r: 30, tipo: 'gelo', minX: 400, maxX: 700, minY: 120, maxY: 400 }
    ];

    const canvas = document.getElementById('canvas-jogo');
    const ctx = canvas.getContext('2d');
    const overlayTela = document.getElementById('overlay-tela');

    const salaId = 'NEVE-' + Math.random().toString(36).substring(2, 7).toUpperCase();
    let peer = null;
    let urlControle = '';

    function inicializarPeer() {
      peer = new Peer(salaId);
      peer.on('open', (id) => {
        const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        urlControle = `${baseHref}neve_controle.html?sala=${id}`;
        document.getElementById('link-controle').innerText = urlControle;

        const qrEl = document.getElementById('qrcode-box');
        qrEl.innerHTML = '';
        new QRCode(qrEl, {
          text: urlControle,
          width: 140,
          height: 140,
          colorDark: '#061826',
          colorLight: '#ffffff'
        });
      });

      peer.on('connection', (conn) => {
        conn.on('data', (msg) => {
          if (msg.tipo === 'entrar') {
            let limite = (modoJogo === 'bot') ? 1 : qtdMaxJogadores;
            if (modoJogo === 'duplas') limite = 4;

            let slotLivre = -1;
            for (let i = 0; i < limite; i++) {
              if (!jogadoresConectados.find(j => j.slot === i)) {
                slotLivre = i;
                break;
              }
            }
            if (slotLivre === -1) {
              conn.send({ tipo: 'sala_cheia' });
              return;
            }

            const novoFighter = {
              slot: slotLivre,
              peerId: conn.peer,
              nome: msg.nome || `Jogador ${slotLivre + 1}`,
              icone: msg.icone || ICONES_CHARS[slotLivre],
              conn: conn,
              x: 150 + (slotLivre % 2) * 800,
              y: 120 + Math.floor(slotLivre / 2) * 300,
              inputVx: 0,
              inputVy: 0,
              vida: 100,
              maxVida: 100,
              aimX: 550,
              aimY: 270,
              isBot: false
            };

            jogadoresConectados.push(novoFighter);

            if (modoJogo === 'bot' && !jogadoresConectados.find(j => j.slot === 1)) {
              jogadoresConectados.push({
                slot: 1,
                peerId: 'BOT',
                nome: 'Robô Noel 🤖',
                icone: '🤖',
                conn: null,
                x: 900,
                y: 360,
                inputVx: 0,
                inputVy: 0,
                vida: 100,
                maxVida: 100,
                aimX: 200,
                aimY: 270,
                isBot: true
              });
            }

            conn.send({
              tipo: 'confirmado',
              slot: slotLivre,
              cor: CORES_JOGADORES[slotLivre]
            });

            atualizarLobby();
          } else if (msg.tipo === 'mover_char' && jogoAtivo) {
            const f = jogadoresConectados.find(j => j.slot === msg.slot);
            if (f) {
              f.inputVx = msg.vx;
              f.inputVy = msg.vy;
            }
          } else if (msg.tipo === 'mover_aim' && jogoAtivo) {
            const f = jogadoresConectados.find(j => j.slot === msg.slot);
            if (f) {
              f.aimX = msg.x;
              f.aimY = msg.y;
            }
          } else if (msg.tipo === 'atirar' && jogoAtivo) {
            const f = jogadoresConectados.find(j => j.slot === msg.slot);
            if (f && f.vida > 0) {
              dispararBolaDeNeve(f);
            }
          }
        });

        conn.on('close', () => {
          jogadoresConectados = jogadoresConectados.filter(j => j.conn !== conn);
          atualizarLobby();
        });
      });
    }
    inicializarPeer();

    function copiarLink() {
      if (!urlControle) return;
      navigator.clipboard.writeText(urlControle);
      alert('✅ Link copiado!');
    }

    function definirModo(modo) {
      modoJogo = modo;
      document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('ativo'));
      event.target.classList.add('ativo');

      if (modo === 'bot') {
        qtdMaxJogadores = 1;
      } else {
        qtdMaxJogadores = 4;
      }
      jogadoresConectados = [];
      atualizarLobby();
    }

    function atualizarLobby() {
      const listaEl = document.getElementById('lista-slots-lobby');
      listaEl.innerHTML = '';

      let metaJogadores = (modoJogo === 'bot') ? 1 : 2;
      let countProntos = jogadoresConectados.filter(j => !j.isBot).length;

      let limiteExibicao = (modoJogo === 'bot') ? 1 : qtdMaxJogadores;
      for (let i = 0; i < limiteExibicao; i++) {
        const jog = jogadoresConectados.find(j => j.slot === i);
        const div = document.createElement('div');
        div.className = 'slot-lobby' + (jog ? ' pronto' : '');
        div.style.borderColor = CORES_JOGADORES[i];

        if (jog) {
          div.innerHTML = `
            <div style="color:${CORES_JOGADORES[i]}; font-weight:900; font-size:0.8rem;">P${i+1} • PRONTO ✅</div>
            <div style="font-size:1.1rem; font-weight:bold; margin-top:2px;">${jog.icone} ${jog.nome}</div>
          `;
        } else {
          div.innerHTML = `
            <div style="color:${CORES_JOGADORES[i]}; font-weight:900; font-size:0.8rem;">P${i+1} • VAGA ABERTA</div>
            <div style="font-size:0.85rem; color:#94a3b8; margin-top:2px;">Escaneie o QR Code...</div>
          `;
        }
        listaEl.appendChild(div);
      }

      if (modoJogo === 'bot' && jogadoresConectados.find(j => j.slot === 0)) {
        countProntos = 1;
        metaJogadores = 1;
      }

      const btnIniciar = document.getElementById('btn-iniciar');
      if (countProntos >= metaJogadores || (modoJogo === 'bot' && countProntos >= 1)) {
        btnIniciar.disabled = false;
        btnIniciar.innerText = '❄️ INICIAR BATALHA!';
      } else {
        btnIniciar.disabled = true;
        btnIniciar.innerText = `⏳ AGUARDANDO JOGADORES...`;
      }
      atualizarMKHUD();
    }

    function atualizarMKHUD() {
      const mkContainer = document.getElementById('mk-hud-container');
      mkContainer.innerHTML = '';

      let limiteExibicao = (modoJogo === 'bot') ? 2 : (modoJogo === 'duplas' ? 4 : qtdMaxJogadores);
      for (let i = 0; i < Math.max(2, jogadoresConectados.length); i++) {
        const f = jogadoresConectados.find(j => j.slot === i);
        const nomeF = f ? `${f.icone} ${f.nome}` : `P${i+1} (Vago)`;
        const vidaF = f ? f.vida : 100;
        const maxVidaF = f ? f.maxVida : 100;
        const pct = Math.max(0, (vidaF / maxVidaF) * 100);
        const cor = CORES_JOGADORES[i];

        const div = document.createElement('div');
        div.className = 'fighter-hud';
        div.style.borderColor = cor;
        div.innerHTML = `
          <div class="fighter-name" style="color:${cor};">${nomeF}</div>
          <div class="health-bar-container">
            <div class="health-bar-fill" style="width: ${pct}%; background: ${cor};"></div>
            <div class="health-text">${Math.max(0, vidaF)}/${maxVidaF}</div>
          </div>
        `;
        mkContainer.appendChild(div);
      }
    }

    function dispararBolaDeNeve(atirador) {
      tocarSom('atirar');
      const angulo = Math.atan2(atirador.aimY - atirador.y, atirador.aimX - atirador.x);
      bolasDeNeve.push({
        x: atirador.x,
        y: atirador.y,
        vx: Math.cos(angulo) * 10,
        vy: Math.sin(angulo) * 10,
        slotOrigem: atirador.slot,
        cor: CORES_JOGADORES[atirador.slot]
      });
    }

    function criarExplosaoNeve(x, y, cor) {
      for(let i=0; i<12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = Math.random() * 4 + 2;
        particulasVFX.push({
          x: x, y: y,
          vx: Math.cos(ang) * vel,
          vy: Math.sin(ang) * vel,
          r: Math.random() * 4 + 2,
          cor: cor,
          vida: 1.0
        });
      }
    }

    function iniciarBatalha() {
      overlayTela.style.display = 'none';
      bolasDeNeve = [];
      particulasVFX = [];

      const posicoes = [
        { x: 150, y: 150 },
        { x: 950, y: 390 },
        { x: 150, y: 390 },
        { x: 950, y: 150 }
      ];

      jogadoresConectados.forEach((f, idx) => {
        f.x = posicoes[idx % posicoes.length].x;
        f.y = posicoes[idx % posicoes.length].y;
        f.inputVx = 0;
        f.inputVy = 0;
        f.vida = 100;
        f.maxVida = 100;
      });

      jogoAtivo = true;
      requestAnimationFrame(loopJogo);
    }

    function loopJogo() {
      if (!jogoAtivo) return;

      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // 1. Fundo Gradiente e Neve Caindo
      ctx.fillStyle = '#0f2942';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.roundRect(30, 30, W - 60, H - 60, 24);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Desenhar Flocos de Fundo
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      neveFundo.forEach(f => {
        f.y += f.speed;
        if(f.y > H) f.y = 0;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
        ctx.fill();
      });

      // 2. Atualizar e Desenhar Obstáculos Móveis
      obstaculos.forEach(obs => {
        obs.x += obs.vx;
        obs.y += obs.vy;
        if (obs.minX && (obs.x < obs.minX || obs.x > obs.maxX)) obs.vx *= -1;
        if (obs.minY && (obs.y < obs.minY || obs.y > obs.maxY)) obs.vy *= -1;

        ctx.save();
        ctx.translate(obs.x, obs.y);
        if (obs.tipo === 'pinheiro') {
          ctx.fillStyle = '#15803d';
          ctx.beginPath();
          ctx.moveTo(0, -35);
          ctx.lineTo(-28, 25);
          ctx.lineTo(28, 25);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#78350f';
          ctx.fillRect(-6, 25, 12, 14);
        } else if (obs.tipo === 'boneco') {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 12, 22, 0, Math.PI*2);
          ctx.arc(0, -10, 16, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-10, -22, 20, 6);
        } else {
          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath();
          ctx.roundRect(-24, -20, 48, 40, 8);
          ctx.fill();
          ctx.strokeStyle = '#e0f2fe';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      });

      // 3. IA do Bot
      if (modoJogo === 'bot') {
        const bot = jogadoresConectados.find(j => j.isBot);
        const alvo = jogadoresConectados.find(j => !j.isBot);
        if (bot && alvo && bot.vida > 0 && alvo.vida > 0) {
          // Movimentação automática do bot
          const angBot = Math.atan2(alvo.y - bot.y, alvo.x - bot.x);
          bot.x += Math.cos(angBot) * 1.5;
          bot.y += Math.sin(angBot) * 1.5;
          bot.aimX = alvo.x + (Math.random() * 30 - 15);
          bot.aimY = alvo.y + (Math.random() * 30 - 15);
          if (Math.random() < 0.035) {
            dispararBolaDeNeve(bot);
          }
        }
      }

      // 4. Movimentação dos Jogadores com Joystick
      jogadoresConectados.forEach(f => {
        if (f.vida > 0 && !f.isBot) {
          f.x += f.inputVx * 3.5;
          f.y += f.inputVy * 3.5;
        }
        // Limites da Arena
        f.x = Math.max(70, Math.min(W - 70, f.x));
        f.y = Math.max(70, Math.min(H - 70, f.y));
      });

      // 5. Bolas de Neve e Colisões
      for (let i = bolasDeNeve.length - 1; i >= 0; i--) {
        const b = bolasDeNeve[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.beginPath();
        ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = b.cor;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Colisão com Obstáculos
        let colidiu = false;
        for (let obs of obstaculos) {
          if (Math.hypot(b.x - obs.x, b.y - obs.y) < obs.r) {
            criarExplosaoNeve(b.x, b.y, '#ffffff');
            colidiu = true;
            break;
          }
        }

        if (colidiu) {
          bolasDeNeve.splice(i, 1);
          continue;
        }

        // Colisão com Jogadores
        for (let f of jogadoresConectados) {
          if (f.slot !== b.slotOrigem && f.vida > 0) {
            if (Math.hypot(b.x - f.x, b.y - f.y) < 28) {
              f.vida -= 15;
              tocarSom('acertar');
              criarExplosaoNeve(f.x, f.y, CORES_JOGADORES[b.slotOrigem]);
              bolasDeNeve.splice(i, 1);
              atualizarMKHUD();
              colidiu = true;
              break;
            }
          }
        }

        if (colidiu) continue;

        // Fora da arena
        if (b.x < 30 || b.x > W - 30 || b.y < 30 || b.y > H - 30) {
          bolasDeNeve.splice(i, 1);
        }
      }

      // 6. Atualizar e Desenhar Partículas VFX
      for (let i = particulasVFX.length - 1; i >= 0; i--) {
        const p = particulasVFX[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vida -= 0.04;
        if (p.vida <= 0) {
          particulasVFX.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.vida;
        ctx.fillStyle = p.cor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // 7. Desenhar Lutadores e suas Miras
      jogadoresConectados.forEach(f => {
        const cor = CORES_JOGADORES[f.slot];

        if (f.vida > 0) {
          // Linha de Mira
          ctx.strokeStyle = cor;
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.lineTo(f.aimX, f.aimY);
          ctx.stroke();
          ctx.setLineDash([]);

          // Alvo/Mira
          ctx.fillStyle = cor;
          ctx.beginPath();
          ctx.arc(f.aimX, f.aimY, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Avatar
        ctx.save();
        ctx.translate(f.x, f.y);
        if (f.vida <= 0) {
          ctx.rotate(Math.PI / 2);
          ctx.font = '32px sans-serif';
          ctx.fillText('💀', -16, 12);
        } else {
          ctx.fillStyle = cor;
          ctx.beginPath();
          ctx.arc(0, 0, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.font = '30px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(f.icone, 0, 0);

          ctx.font = 'bold 12px sans-serif';
          ctx.fillStyle = '#fff';
          ctx.fillText(f.nome, 0, -34);
        }
        ctx.restore();
      });

      // 8. Condição de Vitória
      const vivos = jogadoresConectados.filter(j => j.vida > 0);
      if (jogadoresConectados.length > 1 && vivos.length <= 1) {
        finalizarBatalha(vivos[0] || null);
        return;
      } else if (modoJogo === 'bot' && (jogadoresConectados[0].vida <= 0 || jogadoresConectados[1].vida <= 0)) {
        finalizarBatalha(jogadoresConectados.find(j => j.vida > 0) || null);
        return;
      }

      requestAnimationFrame(loopJogo);
    }

    function finalizarBatalha(vencedor) {
      jogoAtivo = false;
      tocarSom('vitoria');

      const podioEl = document.getElementById('podio-resultado');
      podioEl.style.display = 'block';
      podioEl.innerHTML = `
        <h3 style="color:#ffd700; font-size:2rem; margin-bottom:10px;">🏆 VENCEDOR DA BATALHA! 🏆</h3>
        <div style="background:rgba(0,0,0,0.85); border:3px solid ${vencedor ? CORES_JOGADORES[vencedor.slot] : '#ffd700'}; border-radius:18px; padding:16px; display:inline-block;">
          <div style="font-size:3.5rem;">${vencedor ? vencedor.icone : '🏅'}</div>
          <div style="font-size:1.4rem; font-weight:bold; color:#ffd700; margin-top:6px;">${vencedor ? vencedor.nome : 'Empate!'}</div>
        </div>
      `;

      document.getElementById('overlay-titulo').innerText = '❄️ FIM DA BATALHA!';
      document.getElementById('overlay-sub').innerText = 'Reinicie o jogo para uma nova rodada!';
      overlayTela.style.display = 'flex';
      document.getElementById('btn-iniciar').style.display = 'inline-block';
      document.getElementById('btn-iniciar').innerText = '🔄 JOGAR NOVAMENTE';
    }
  </script>
