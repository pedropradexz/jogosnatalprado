<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Corrida de Trenó Maluca 🛷🏁</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at center, #0f2e47 0%, #04101a 95%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      border: 10px solid transparent;
      border-image: repeating-linear-gradient(45deg, #ffd700, #ffd700 20px, #c41e3a 20px, #c41e3a 40px) 10;
    }

    .pisca-pisca {
      width: 100%; display: flex; justify-content: space-around; padding: 4px 16px; z-index: 4; flex-shrink: 0;
    }
    .luz {
      width: 12px; height: 18px; border-radius: 50%;
      animation: piscar 0.8s infinite alternate;
    }
    .luz:nth-child(4n+1) { background: #ff2a2a; box-shadow: 0 0 12px #ff2a2a; }
    .luz:nth-child(4n+2) { background: #ffd700; box-shadow: 0 0 12px #ffd700; animation-delay: 0.2s; }
    .luz:nth-child(4n+3) { background: #2ecc71; box-shadow: 0 0 12px #2ecc71; animation-delay: 0.4s; }
    .luz:nth-child(4n+4) { background: #3498db; box-shadow: 0 0 12px #3498db; animation-delay: 0.6s; }

    @keyframes piscar {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    header { z-index: 4; width: 96%; flex-shrink: 0; }
    h1 { font-size: 1.65rem; color: #ffd700; text-shadow: 0 3px 8px rgba(0,0,0,0.85); letter-spacing: 1px; }

    .hud-superior {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 3px; background: rgba(0,0,0,0.65); padding: 4px 16px;
      border-radius: 16px; border: 2px solid #ffd700; font-size: 0.92rem; font-weight: bold;
    }

    /* Layout Vertical da TV: Pista 3D em cima + Quadrantes de Câmera em baixo */
    #layout-tv-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 96vw;
      height: calc(100vh - 125px);
      margin: auto;
      z-index: 10;
    }

    /* Retângulo Superior: Pista 3D */
    #container-pista {
      position: relative;
      flex: 1.45;
      width: 100%;
      border: 4px solid #ffd700;
      border-radius: 18px;
      overflow: hidden;
      background: #0b2545;
      box-shadow: 0 8px 30px rgba(0,0,0,0.85);
    }

    #canvas-pista {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Área Inferior: Quadrantes Dinâmicos das Câmeras dos Celulares */
    #container-quadrantes {
      flex: 1;
      width: 100%;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(1, 1fr);
    }
    #container-quadrantes.grid-1 { grid-template-columns: 1fr; }
    #container-quadrantes.grid-2 { grid-template-columns: repeat(2, 1fr); }
    #container-quadrantes.grid-3 { grid-template-columns: repeat(3, 1fr); }
    #container-quadrantes.grid-4 { grid-template-columns: repeat(4, 1fr); }

    .quadrante-cam {
      position: relative;
      background: rgba(0, 0, 0, 0.75);
      border: 4px solid #ffd700;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .quadrante-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    .quadrante-topo {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .quadrante-status {
      position: relative;
      z-index: 2;
      padding: 5px 8px;
      background: rgba(0,0,0,0.8);
      font-size: 0.82rem;
      font-weight: bold;
      color: #ffd700;
    }

    /* Telas de Lobby (QR Code) e Pódio */
    #overlay-tela {
      display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(6, 24, 38, 0.98); z-index: 30; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px; text-align: center;
      overflow-y: auto;
    }

    #overlay-tela h2 { font-size: 2.5rem; color: #ffd700; margin-bottom: 8px; text-shadow: 0 4px 12px rgba(0,0,0,0.8); }
    .sub-selecao { font-size: 1.05rem; color: #e2e8f0; margin-bottom: 16px; max-width: 720px; }

    .seletor-qtd {
      display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center;
    }
    .btn-qtd {
      background: rgba(255,255,255,0.1); color: #fff; border: 2px solid #ffd700;
      padding: 10px 22px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 1.05rem;
      transition: 0.2s;
    }
    .btn-qtd.ativo { background: #ffd700; color: #061826; transform: scale(1.07); }

    #painel-conexao {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      border: 3px solid #ffd700;
      border-radius: 22px;
      padding: 18px 26px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      max-width: 960px;
    }

    #qrcode-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    #lista-slots-lobby {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      min-width: 340px;
    }

    .slot-lobby {
      background: rgba(255,255,255,0.07);
      border: 2px dashed #64748b;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: left;
      transition: 0.25s;
    }
    .slot-lobby.pronto {
      border-style: solid;
      background: rgba(46, 204, 113, 0.16);
    }

    .btn-acao {
      background: #2ecc71; color: #fff; border: none; padding: 14px 38px;
      font-size: 1.25rem; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transition: transform 0.2s;
    }
    .btn-acao:hover { transform: scale(1.05); background: #27ae60; }
    .btn-acao:disabled { background: #475569; box-shadow: none; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

  <div class="pisca-pisca" id="luzes-topo"></div>

  <header>
    <h1>🛷 CORRIDA DE TRENÓ MALUCA 🏁</h1>
    <div class="hud-superior">
      <div>TEMPO: <span id="tempo-valor" style="color:#3498db;">75</span>s</div>
      <div id="hud-ranking">Aguardando jogadores conectarem pelo celular...</div>
    </div>
  </header>

  <div id="layout-tv-vertical">
    <!-- Retângulo Superior: Pista 3D -->
    <div id="container-pista">
      <canvas id="canvas-pista" width="1200" height="520"></canvas>
    </div>

    <!-- Retângulo Inferior: Quadrantes das Câmeras dos Celulares -->
    <div id="container-quadrantes" class="grid-1"></div>
  </div>

  <div class="pisca-pisca" id="luzes-base"></div>

  <!-- Tela Inicial: Escolha de Quantidade + QR Code + Status dos Jogadores -->
  <div id="overlay-tela">
    <h2 id="overlay-titulo">🛷 CORRIDA DE TRENÓ MALUCA</h2>
    <p class="sub-selecao" id="overlay-sub">
      1º Selecione quantos jogadores vão correr (1 a 4) &nbsp;•&nbsp; 2º Escaneie o QR Code no celular para escolher seu nome e personagem!
    </p>

    <div class="seletor-qtd" id="seletor-qtd-box">
      <button class="btn-qtd ativo" onclick="definirQtdJogadores(1)">1 JOGADOR</button>
      <button class="btn-qtd" onclick="definirQtdJogadores(2)">2 JOGADORES</button>
      <button class="btn-qtd" onclick="definirQtdJogadores(3)">3 JOGADORES</button>
      <button class="btn-qtd" onclick="definirQtdJogadores(4)">4 JOGADORES</button>
    </div>

    <div id="painel-conexao">
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div id="qrcode-box"></div>
        <div id="link-controle" style="font-size:0.78rem; color:#ffd700; max-width:240px; word-break:break-all;">Gerando link da sala...</div>
        <button onclick="copiarLinkControle()" style="background:#3498db; color:#fff; border:none; padding:5px 12px; border-radius:10px; cursor:pointer; font-size:0.8rem; font-weight:bold;">
          📋 Copiar Link
        </button>
      </div>

      <div id="lista-slots-lobby"></div>
    </div>

    <div id="podio-resultado" style="display:none; margin-bottom: 18px; width: 92%; max-width: 820px;"></div>

    <div style="display:flex; gap: 14px; align-items:center; flex-wrap:wrap; justify-content:center;">
      <button class="btn-acao" id="btn-iniciar" onclick="iniciarContagemLargada()" disabled>⏳ AGUARDANDO JOGADORES...</button>
    </div>
  </div>

  <script>
    function criarLuzes(id) {
      const el = document.getElementById(id);
      for (let i = 0; i < 18; i++) {
        const l = document.createElement('div'); l.className = 'luz'; el.appendChild(l);
      }
    }
    criarLuzes('luzes-topo');
    criarLuzes('luzes-base');

    // Efeitos Sonoros
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarSom(tipo) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const agora = audioCtx.currentTime;

      if (tipo === 'pulo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, agora);
        osc.frequency.exponentialRampToValueAtTime(650, agora + 0.18);
        gain.gain.setValueAtTime(0.22, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.2);
        osc.start(agora); osc.stop(agora + 0.2);
      } else if (tipo === 'item') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, agora);
        osc.frequency.setValueAtTime(880, agora + 0.08);
        osc.frequency.setValueAtTime(1174.66, agora + 0.16);
        gain.gain.setValueAtTime(0.25, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.28);
        osc.start(agora); osc.stop(agora + 0.28);
      } else if (tipo === 'poder') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, agora);
        osc.frequency.exponentialRampToValueAtTime(220, agora + 0.35);
        gain.gain.setValueAtTime(0.28, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.38);
        osc.start(agora); osc.stop(agora + 0.38);
      } else if (tipo === 'batida') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, agora);
        osc.frequency.exponentialRampToValueAtTime(45, agora + 0.45);
        gain.gain.setValueAtTime(0.35, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.48);
        osc.start(agora); osc.stop(agora + 0.48);
      } else if (tipo === 'bip') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, agora);
        gain.gain.setValueAtTime(0.15, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.15);
        osc.start(agora); osc.stop(agora + 0.15);
      } else if (tipo === 'vitoria') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, agora);
        osc.frequency.setValueAtTime(659.25, agora + 0.15);
        osc.frequency.setValueAtTime(783.99, agora + 0.3);
        osc.frequency.setValueAtTime(1046.50, agora + 0.45);
        gain.gain.setValueAtTime(0.35, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.8);
        osc.start(agora); osc.stop(agora + 0.8);
      }
    }

    const PERSONAGENS = [
      { id: 0, nome: 'Papai Noel', icone: '🎅', attr: 'Equilibrado', velMax: 1.00, agilidade: 1.00 },
      { id: 1, nome: 'Mamãe Noel', icone: '🤶', attr: 'Aceleração +', velMax: 0.99, agilidade: 1.08 },
      { id: 2, nome: 'Rena Rodolfo', icone: '🦌', attr: 'Velocidade +', velMax: 1.07, agilidade: 0.95 },
      { id: 3, nome: 'Duende Chefe', icone: '🧝', attr: 'Troca Rápida', velMax: 0.97, agilidade: 1.18 },
      { id: 4, nome: 'Boneco Neve', icone: '⛄', attr: 'Deslize Suave', velMax: 1.00, agilidade: 1.04 },
      { id: 5, nome: 'O Grinch', icone: '💚', attr: 'Turbo Extra', velMax: 1.05, agilidade: 0.98 },
      { id: 6, nome: 'Biscoito', icone: '🍪', attr: 'Super Leve', velMax: 0.98, agilidade: 1.15 },
      { id: 7, nome: 'Pinguim', icone: '🐧', attr: 'Estável', velMax: 1.01, agilidade: 1.03 },
      { id: 8, nome: 'Urso Polar', icone: '🐻‍❄️', attr: 'Pesado', velMax: 1.04, agilidade: 0.92 },
      { id: 9, nome: 'Fada Doce', icone: '🧚', attr: 'Ímã de Itens', velMax: 0.99, agilidade: 1.12 },
      { id: 10, nome: 'Quebra-Nozes', icone: '💂', attr: 'Precisão', velMax: 1.02, agilidade: 1.02 },
      { id: 11, nome: 'Yeti Neves', icone: '🦍', attr: 'Força Bruta', velMax: 1.06, agilidade: 0.90 }
    ];

    const CORES_JOGADORES = ['#ff2a2a', '#2ecc71', '#3498db', '#ffd700'];
    const PODERES_DISPONIVEIS = [
      { id: 'congelar', nome: '❄️ CONGELAR LÍDER', desc: 'Congela o oponente por 3s' },
      { id: 'bomba', nome: '💣 BOMBA NA PISTA', desc: 'Explode e para o oponente por 3s' },
      { id: 'trava', nome: '🔒 TRAVAR DIREÇÃO', desc: 'Trava a troca de faixa do oponente por 4s' },
      { id: 'turbo', nome: '🚀 SUPER TURBO', desc: 'Dispara na frente em alta velocidade' }
    ];

    let qtdJogadores = 1;
    let jogadoresConectados = []; // { slot, nome, charId, pronto, conn, stream, videoEl }
    let corridaAtiva = false;
    let tempoRestante = 75;
    let timerCorrida = null;

    let corredores = [];
    let objetosPista = [];
    let decoracoesLado = [];
    let faixaZOffset = 0;

    let flocosCeu = Array.from({ length: 55 }, () => ({
      x: Math.random() * 1200,
      y: Math.random() * 190,
      r: Math.random() * 2.5 + 1,
      v: Math.random() * 1.4 + 0.4
    }));

    const canvasPista = document.getElementById('canvas-pista');
    const ctxPista = canvasPista.getContext('2d');
    const overlayTela = document.getElementById('overlay-tela');
    const HORIZONTE_Y = 175;

    // =========================================================================
    // CONEXÃO PEERJS (CELULAR -> TV) + QR CODE DINÂMICO
    // =========================================================================
    const salaId = 'NATAL-' + Math.random().toString(36).substring(2, 7).toUpperCase();
    const peer = new Peer(salaId);
    let urlControleAtual = '';

    peer.on('open', (id) => {
      const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      urlControleAtual = `${baseHref}controle.html?sala=${id}`;
      document.getElementById('link-controle').innerText = urlControleAtual;

      const qrEl = document.getElementById('qrcode-box');
      qrEl.innerHTML = '';
      new QRCode(qrEl, {
        text: urlControleAtual,
        width: 150,
        height: 150,
        colorDark: '#061826',
        colorLight: '#ffffff'
      });
    });

    function copiarLinkControle() {
      if (!urlControleAtual) return;
      navigator.clipboard.writeText(urlControleAtual);
      alert('✅ Link copiado! Abra no navegador do celular (ou em outra aba para testar).');
    }

    // Recebe conexão de dados do celular
    peer.on('connection', (conn) => {
      conn.on('data', (msg) => {
        if (msg.tipo === 'entrar') {
          // Encontra o primeiro slot livre dentro de qtdJogadores
          let slotLivre = -1;
          for (let i = 0; i < qtdJogadores; i++) {
            if (!jogadoresConectados.find(j => j.slot === i)) {
              slotLivre = i;
              break;
            }
          }
          if (slotLivre === -1) {
            conn.send({ tipo: 'sala_cheia' });
            return;
          }

          const novoJogador = {
            slot: slotLivre,
            peerId: conn.peer,
            nome: msg.nome || `Jogador ${slotLivre + 1}`,
            charId: msg.charId ?? slotLivre,
            pronto: true,
            conn: conn,
            stream: null
          };
          jogadoresConectados.push(novoJogador);
          tocarSom('bip');

          conn.send({
            tipo: 'confirmado',
            slot: slotLivre,
            cor: CORES_JOGADORES[slotLivre],
            char: PERSONAGENS[novoJogador.charId]
          });

          atualizarLobbyEQuadrantes();
        } else if (msg.tipo === 'comando' && corridaAtiva) {
          const c = corredores.find(cor => cor.jogadorIdx === msg.slot);
          if (!c) return;

          // 1. Inclinação da cabeça: Troca de faixa ou movimento lateral
          if (c.travaDirecaoTimer <= 0) {
            c.vx = msg.dirX || 0; // -1 esquerda, 0 centro, 1 direita
          } else {
            c.vx = 0;
          }

          // 2. Abaixar a cabeça: Frear
          c.freiando = !!msg.freio;

          // 3. Pulo: Saltar obstáculos
          if (msg.pulo && !c.pulando && c.paradoBatidaTimer <= 0) {
            c.pulando = true;
            c.velPulo = 14.5;
            tocarSom('pulo');
          }

          // 4. Palma da mão aberta: Usar o presente coletado dentro dos 12s!
          if (msg.usarPoder && c.itemGuardado && c.itemTempoRestante > 0) {
            ativarPoderDoJogador(c);
          }
        }
      });

      conn.on('close', () => {
        jogadoresConectados = jogadoresConectados.filter(j => j.conn !== conn);
        atualizarLobbyEQuadrantes();
      });
    });

    // Recebe o stream da câmera frontal do celular para exibir no quadrante inferior da TV!
    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        const jog = jogadoresConectados.find(j => j.peerId === call.peer);
        if (jog) {
          jog.stream = remoteStream;
          const videoEl = document.getElementById(`video-quadrante-${jog.slot}`);
          if (videoEl) {
            videoEl.srcObject = remoteStream;
          }
        }
      });
    });

    function definirQtdJogadores(qtd) {
      qtdJogadores = qtd;
      document.querySelectorAll('.btn-qtd').forEach((btn, idx) => {
        btn.classList.toggle('ativo', idx + 1 === qtd);
      });
      // Remove jogadores excedentes se diminuir a quantidade
      jogadoresConectados = jogadoresConectados.filter(j => j.slot < qtdJogadores);
      atualizarLobbyEQuadrantes();
    }

    function atualizarLobbyEQuadrantes() {
      // 1. Atualiza slots no Lobby
      const listaEl = document.getElementById('lista-slots-lobby');
      listaEl.innerHTML = '';

      let prontosCount = 0;
      for (let i = 0; i < qtdJogadores; i++) {
        const jog = jogadoresConectados.find(j => j.slot === i);
        const div = document.createElement('div');
        div.className = 'slot-lobby' + (jog ? ' pronto' : '');
        div.style.borderColor = jog ? CORES_JOGADORES[i] : '#64748b';

        if (jog) {
          prontosCount++;
          const char = PERSONAGENS[jog.charId];
          div.innerHTML = `
            <div style="color:${CORES_JOGADORES[i]}; font-weight:900; font-size:0.85rem;">P${i + 1} • PRONTO ✅</div>
            <div style="font-size:1.3rem; font-weight:bold; margin-top:2px;">${char.icone} ${jog.nome}</div>
            <div style="font-size:0.78rem; color:#cbd5e1;">${char.nome} (${char.attr})</div>
          `;
        } else {
          div.innerHTML = `
            <div style="color:${CORES_JOGADORES[i]}; font-weight:900; font-size:0.85rem;">P${i + 1} • VAGA ABERTA</div>
            <div style="font-size:0.95rem; color:#94a3b8; margin-top:4px;">Escaneie o QR Code no celular...</div>
          `;
        }
        listaEl.appendChild(div);
      }

      const btnIniciar = document.getElementById('btn-iniciar');
      if (prontosCount >= qtdJogadores) {
        btnIniciar.disabled = false;
        btnIniciar.innerText = '🚦 INICIAR CORRIDA!';
      } else {
        btnIniciar.disabled = true;
        btnIniciar.innerText = `⏳ AGUARDANDO (${prontosCount}/${qtdJogadores})...`;
      }

      // 2. Adapta os Quadrantes Inferiores de Câmera conforme a quantidade de jogadores
      const containerQuad = document.getElementById('container-quadrantes');
      containerQuad.className = `grid-${qtdJogadores}`;
      containerQuad.innerHTML = '';

      for (let i = 0; i < qtdJogadores; i++) {
        const jog = jogadoresConectados.find(j => j.slot === i);
        const char = jog ? PERSONAGENS[jog.charId] : null;
        const qDiv = document.createElement('div');
        qDiv.className = 'quadrante-cam';
        qDiv.style.borderColor = CORES_JOGADORES[i];
        qDiv.innerHTML = `
          <video id="video-quadrante-${i}" class="quadrante-video" autoplay playsinline muted></video>
          <div class="quadrante-topo">
            <span style="color:${CORES_JOGADORES[i]};">P${i + 1} ${jog ? jog.nome : 'Aguardando'}</span>
            <span>${char ? char.icone : '📱'}</span>
          </div>
          <div class="quadrante-status" id="status-quadrante-${i}">
            ${jog ? 'Câmera do celular conectada!' : 'Escaneie o QR Code'}
          </div>
        `;
        containerQuad.appendChild(qDiv);

        if (jog && jog.stream) {
          const vEl = document.getElementById(`video-quadrante-${i}`);
          if (vEl) vEl.srcObject = jog.stream;
        }
      }
    }
    atualizarLobbyEQuadrantes();

    function iniciarContagemLargada() {
      document.getElementById('podio-resultado').style.display = 'none';
      const titulo = document.getElementById('overlay-titulo');
      const btnIniciar = document.getElementById('btn-iniciar');
      btnIniciar.style.display = 'none';

      let seg = 3;
      titulo.innerText = `🚦 PREPARE-SE... ${seg}`;
      tocarSom('bip');

      const intv = setInterval(() => {
        seg--;
        if (seg > 0) {
          titulo.innerText = `🚦 PREPARE-SE... ${seg}`;
          tocarSom('bip');
        } else {
          clearInterval(intv);
          btnIniciar.style.display = 'inline-block';
          iniciarCorrida();
        }
      }, 1000);
    }

    function iniciarCorrida() {
      overlayTela.style.display = 'none';
      tempoRestante = 75;
      document.getElementById('tempo-valor').innerText = tempoRestante;
      objetosPista = [];
      decoracoesLado = [];

      for (let z = 0.05; z <= 1.0; z += 0.12) {
        decoracoesLado.push({ z: z, lado: -1, icone: Math.random() < 0.7 ? '🎄' : '⛄' });
        decoracoesLado.push({ z: z, lado: 1, icone: Math.random() < 0.7 ? '🎄' : '🏮' });
      }

      // Cria os corredores com posições reais de corrida e faixas separadas
      corredores = [];
      const faixasIniciais = [-0.6, -0.2, 0.2, 0.6];
      for (let i = 0; i < qtdJogadores; i++) {
        const jog = jogadoresConectados.find(j => j.slot === i);
        const char = jog ? PERSONAGENS[jog.charId] : PERSONAGENS[i];
        corredores.push({
          jogadorIdx: i,
          nome: jog ? jog.nome : `Jogador ${i + 1}`,
          conn: jog ? jog.conn : null,
          char: char,
          cor: CORES_JOGADORES[i],
          xNorm: faixasIniciais[i],
          vx: 0,
          velocidadeAtual: 1.0 * char.velMax,
          distancia: 0, // Define quem realmente está na frente ou ultrapassando!
          pulando: false,
          alturaPulo: 0,
          velPulo: 0,
          freiando: false,
          paradoBatidaTimer: 0, // 3 segundos (180 frames a 60fps) parado se bater!
          congeladoTimer: 0,
          travaDirecaoTimer: 0,
          turboTimer: 0,
          itemGuardado: null,
          itemTempoRestante: 0 // 12 segundos (720 frames a 60fps) para abrir a palma da mão!
        });

        if (jog && jog.conn) {
          jog.conn.send({ tipo: 'corrida_iniciada' });
        }
      }

      corridaAtiva = true;
      atualizarHUDCorrida();

      if (timerCorrida) clearInterval(timerCorrida);
      timerCorrida = setInterval(() => {
        if (!corridaAtiva) return;
        tempoRestante--;
        document.getElementById('tempo-valor').innerText = tempoRestante;
        if (tempoRestante <= 0) {
          encerrarCorrida();
        }
      }, 1000);

      requestAnimationFrame(loopPrincipalPista);
    }

    function ativarPoderDoJogador(c) {
      const poder = c.itemGuardado;
      c.itemGuardado = null;
      c.itemTempoRestante = 0;
      tocarSom('poder');

      if (c.conn) {
        c.conn.send({ tipo: 'item_atualizado', item: null, tempo: 0 });
      }

      if (poder.id === 'turbo') {
        c.turboTimer = 210; // 3.5 segundos de turbo forte para ultrapassar!
      } else {
        // Escolhe o oponente mais próximo à frente ou o líder para atacar
        const oponentes = corredores
          .filter(o => o.jogadorIdx !== c.jogadorIdx)
          .sort((a, b) => b.distancia - a.distancia);

        const alvo = oponentes[0];
        if (alvo) {
          if (poder.id === 'congelar') {
            alvo.congeladoTimer = 60; // 3s congelado
          } else if (poder.id === 'bomba') {
            alvo.paradoBatidaTimer = 85; // 3s parado pela explosão!
          } else if (poder.id === 'trava') {
            alvo.travaDirecaoTimer = 180; // 4s sem conseguir trocar de pista!
          }
        }
      }
    }

    function atualizarHUDCorrida() {
      const hudEl = document.getElementById('hud-ranking');
      const ordenados = [...corredores].sort((a, b) => b.distancia - a.distancia);
      hudEl.innerHTML = ordenados.map((c, pos) => {
        const statusItem = c.itemGuardado ? `🎁${Math.ceil(c.itemTempoRestante / 60)}s` : '';
        return `<span style="color:${c.cor}; margin: 0 8px;">${pos + 1}º ${c.char.icone} ${c.nome} (${Math.floor(c.distancia)}m) ${statusItem}</span>`;
      }).join(' | ');
    }

    function projetar3D(xNorm, z) {
      const W = canvasPista.width;
      const H = canvasPista.height;
      const p = Math.pow(Math.max(0.01, z), 1.35);
      const y = HORIZONTE_Y + p * (H - HORIZONTE_Y);
      const meiaLarguraPista = 95 + p * 475;
      const x = (W / 2) + xNorm * meiaLarguraPista;
      const escala = 0.24 + p * 1.05;
      return { x, y, escala, meiaLarguraPista };
    }

    function loopPrincipalPista() {
      if (!corridaAtiva) return;

      const W = canvasPista.width;
      const H = canvasPista.height;
      ctxPista.clearRect(0, 0, W, H);

      // 1. Céu Noturno Natalino
      const gradCeu = ctxPista.createLinearGradient(0, 0, 0, HORIZONTE_Y);
      gradCeu.addColorStop(0, '#040d21');
      gradCeu.addColorStop(0.6, '#0f3460');
      gradCeu.addColorStop(1, '#1e6091');
      ctxPista.fillStyle = gradCeu;
      ctxPista.fillRect(0, 0, W, HORIZONTE_Y);

      ctxPista.fillStyle = 'rgba(46, 204, 113, 0.16)';
      ctxPista.beginPath();
      ctxPista.ellipse(W * 0.35, 65, 320, 32, -0.08, 0, Math.PI * 2);
      ctxPista.fill();

      ctxPista.fillStyle = '#fef08a';
      ctxPista.beginPath();
      ctxPista.arc(W - 140, 58, 26, 0, Math.PI * 2);
      ctxPista.fill();

      // Montanhas Nevadas
      ctxPista.fillStyle = '#cbd5e1';
      ctxPista.beginPath();
      ctxPista.moveTo(0, HORIZONTE_Y);
      ctxPista.lineTo(180, 105);
      ctxPista.lineTo(390, HORIZONTE_Y);
      ctxPista.lineTo(640, 95);
      ctxPista.lineTo(900, HORIZONTE_Y);
      ctxPista.lineTo(1080, 115);
      ctxPista.lineTo(W, HORIZONTE_Y);
      ctxPista.fill();

      ctxPista.fillStyle = '#ffffff';
      flocosCeu.forEach(f => {
        f.y += f.v;
        if (f.y > HORIZONTE_Y) f.y = 0;
        ctxPista.beginPath();
        ctxPista.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctxPista.fill();
      });

      // 2. Pista 3D com 4 Faixas bem marcadas para troca de pista
      const lider = [...corredores].sort((a, b) => b.distancia - a.distancia)[0];
      const velScroll = lider && lider.paradoBatidaTimer <= 0 ? (0.014 * lider.velocidadeAtual) : 0.008;
      faixaZOffset = (faixaZOffset + velScroll) % 0.1;

      const fatias = 22;
      for (let i = 0; i < fatias; i++) {
        const z1 = (i / fatias);
        const z2 = ((i + 1) / fatias);
        const p1 = projetar3D(0, z1);
        const p2 = projetar3D(0, z2);
        const alterna = ((i + Math.floor(faixaZOffset * 100)) % 2 === 0);

        ctxPista.fillStyle = alterna ? '#e2e8f0' : '#f8fafc';
        ctxPista.fillRect(0, p1.y, W, p2.y - p1.y + 1);

        ctxPista.fillStyle = alterna ? '#2563eb' : '#3b82f6';
        ctxPista.beginPath();
        ctxPista.moveTo((W / 2) - p1.meiaLarguraPista, p1.y);
        ctxPista.lineTo((W / 2) + p1.meiaLarguraPista, p1.y);
        ctxPista.lineTo((W / 2) + p2.meiaLarguraPista, p2.y + 1);
        ctxPista.lineTo((W / 2) - p2.meiaLarguraPista, p2.y + 1);
        ctxPista.fill();

        // Zebras Natalinas
        ctxPista.fillStyle = alterna ? '#c41e3a' : '#ffd700';
        const lz1 = 10 + z1 * 22;
        const lz2 = 10 + z2 * 22;
        ctxPista.beginPath();
        ctxPista.moveTo((W / 2) - p1.meiaLarguraPista - lz1, p1.y);
        ctxPista.lineTo((W / 2) - p1.meiaLarguraPista, p1.y);
        ctxPista.lineTo((W / 2) - p2.meiaLarguraPista, p2.y + 1);
        ctxPista.lineTo((W / 2) - p2.meiaLarguraPista - lz2, p2.y + 1);
        ctxPista.fill();

        ctxPista.beginPath();
        ctxPista.moveTo((W / 2) + p1.meiaLarguraPista, p1.y);
        ctxPista.lineTo((W / 2) + p1.meiaLarguraPista + lz1, p1.y);
        ctxPista.lineTo((W / 2) + p2.meiaLarguraPista + lz2, p2.y + 1);
        ctxPista.lineTo((W / 2) + p2.meiaLarguraPista, p2.y + 1);
        ctxPista.fill();

        // Divisórias das 4 pistas (para os jogadores saberem em qual faixa trocar)
        if (alterna) {
          ctxPista.fillStyle = 'rgba(255, 255, 255, 0.55)';
          [-0.4, 0, 0.4].forEach(faixaX => {
            const fx = (W / 2) + faixaX * p1.meiaLarguraPista;
            ctxPista.fillRect(fx - 2, p1.y, 4, p2.y - p1.y);
          });
        }
      }

      // 3. Decorações Laterais
      decoracoesLado.forEach(dec => {
        dec.z += velScroll;
        if (dec.z > 1.08) {
          dec.z = 0.02;
          const itensDec = ['🎄', '⛄', '🏮', '🍭'];
          dec.icone = itensDec[Math.floor(Math.random() * itensDec.length)];
        }
        const proj = projetar3D(dec.lado * 1.24, dec.z);
        ctxPista.font = `${Math.floor(52 * proj.escala)}px sans-serif`;
        ctxPista.textAlign = 'center';
        ctxPista.fillText(dec.icone, proj.x, proj.y);
      });

      // 4. Obstáculos Maiores e Mais Realistas + Caixas de Presente
      if (Math.random() < 0.03) {
        const faixasObs = [-0.6, -0.2, 0.2, 0.6];
        const faixaEscolhida = faixasObs[Math.floor(Math.random() * faixasObs.length)];
        const tiposObs = [
          { tipo: 'obstaculo', subtipo: 'tronco', nome: 'Tronco Gigante' },
          { tipo: 'obstaculo', subtipo: 'rocha', nome: 'Rocha de Gelo' },
          { tipo: 'obstaculo', subtipo: 'barreira', nome: 'Barreira Natalina' }
        ];
        const escolhido = tiposObs[Math.floor(Math.random() * tiposObs.length)];
        objetosPista.push({
          ...escolhido,
          xNorm: faixaEscolhida,
          z: 0.02
        });
      }
      if (Math.random() < 0.018) {
        const faixasCx = [-0.6, -0.2, 0.2, 0.6];
        objetosPista.push({
          tipo: 'caixa',
          xNorm: faixasCx[Math.floor(Math.random() * faixasCx.length)],
          z: 0.02
        });
      }

      objetosPista.sort((a, b) => a.z - b.z);

      for (let i = objetosPista.length - 1; i >= 0; i--) {
        const obj = objetosPista[i];
        obj.z += Math.max(0.008, velScroll);

        const proj = projetar3D(obj.xNorm, obj.z);
        const s = proj.escala;

        if (obj.tipo === 'caixa') {
          const tamCx = Math.max(18, Math.floor(62 * s));
          ctxPista.beginPath();
          ctxPista.ellipse(proj.x, proj.y + 4, tamCx * 0.5, tamCx * 0.18, 0, 0, Math.PI * 2);
          ctxPista.fillStyle = 'rgba(255, 215, 0, 0.55)';
          ctxPista.fill();

          ctxPista.font = `${tamCx}px sans-serif`;
          ctxPista.textAlign = 'center';
          ctxPista.fillText('🎁', proj.x, proj.y);
        } else {
          // Desenho customizado maior e mais realista dos obstáculos na pista!
          ctxPista.save();
          ctxPista.translate(proj.x, proj.y);

          if (obj.subtipo === 'tronco') {
            // Tronco de madeira realista com textura, anéis de corte e neve acumulada
            const w = 135 * s;
            const h = 38 * s;
            // Sombra
            ctxPista.fillStyle = 'rgba(0,0,0,0.45)';
            ctxPista.beginPath();
            ctxPista.ellipse(0, 6 * s, w * 0.54, h * 0.35, 0, 0, Math.PI * 2);
            ctxPista.fill();

            // Corpo cilíndrico do tronco
            const gradTronco = ctxPista.createLinearGradient(0, -h, 0, 0);
            gradTronco.addColorStop(0, '#78350f');
            gradTronco.addColorStop(0.5, '#92400e');
            gradTronco.addColorStop(1, '#451a03');
            ctxPista.fillStyle = gradTronco;
            ctxPista.beginPath();
            ctxPista.roundRect(-w / 2, -h, w, h, 8 * s);
            ctxPista.fill();

            // Corte lateral claro
            ctxPista.fillStyle = '#fde68a';
            ctxPista.beginPath();
            ctxPista.ellipse(w / 2 - 4 * s, -h / 2, 10 * s, h * 0.46, 0, 0, Math.PI * 2);
            ctxPista.fill();

            // Camada de neve no topo
            ctxPista.fillStyle = '#ffffff';
            ctxPista.beginPath();
            ctxPista.roundRect(-w * 0.44, -h - 3 * s, w * 0.84, 9 * s, 5 * s);
            ctxPista.fill();
          } else if (obj.subtipo === 'rocha') {
            // Rocha de gelo facetada realista
            const w = 125 * s;
            const h = 68 * s;
            ctxPista.fillStyle = 'rgba(0,0,0,0.45)';
            ctxPista.beginPath();
            ctxPista.ellipse(0, 5 * s, w * 0.55, 14 * s, 0, 0, Math.PI * 2);
            ctxPista.fill();

            const gradRocha = ctxPista.createLinearGradient(-w / 2, -h, w / 2, 0);
            gradRocha.addColorStop(0, '#bae6fd');
            gradRocha.addColorStop(0.5, '#38bdf8');
            gradRocha.addColorStop(1, '#0369a1');
            ctxPista.fillStyle = gradRocha;
            ctxPista.beginPath();
            ctxPista.moveTo(-w * 0.5, 0);
            ctxPista.lineTo(-w * 0.35, -h * 0.78);
            ctxPista.lineTo(0, -h);
            ctxPista.lineTo(w * 0.38, -h * 0.72);
            ctxPista.lineTo(w * 0.5, 0);
            ctxPista.closePath();
            ctxPista.fill();
            ctxPista.strokeStyle = '#e0f2fe';
            ctxPista.lineWidth = 2 * s;
            ctxPista.stroke();
          } else {
            // Barreira Natalina listrada com postes de madeira
            const w = 140 * s;
            const h = 52 * s;
            ctxPista.fillStyle = '#451a03';
            ctxPista.fillRect(-w * 0.45, -h, 10 * s, h);
            ctxPista.fillRect(w * 0.45 - 10 * s, -h, 10 * s, h);

            ctxPista.fillStyle = '#c41e3a';
            ctxPista.fillRect(-w * 0.5, -h * 0.85, w, 20 * s);
            ctxPista.fillStyle = '#ffffff';
            for (let bx = -w * 0.42; bx < w * 0.42; bx += 28 * s) {
              ctxPista.fillRect(bx, -h * 0.85, 12 * s, 20 * s);
            }
          }

          ctxPista.restore();
        }

        if (obj.z > 1.06) {
          objetosPista.splice(i, 1);
        }
      }

      // 5. Atualizar Física Real dos Corredores (Ultrapassagens, Parada de 3s, Timer de 12s do Presente)
      const mediaDistancia = corredores.reduce((acc, c) => acc + c.distancia, 0) / Math.max(1, corredores.length);

      corredores.forEach((c) => {
        // Timers de penalidade / poder
        if (c.paradoBatidaTimer > 0) c.paradoBatidaTimer--;
        if (c.congeladoTimer > 0) c.congeladoTimer--;
        if (c.travaDirecaoTimer > 0) c.travaDirecaoTimer--;
        if (c.turboTimer > 0) c.turboTimer--;

        // Timer de 12s para abrir a palma da mão e usar o presente!
        if (c.itemGuardado && c.itemTempoRestante > 0) {
          c.itemTempoRestante--;
          if (c.itemTempoRestante <= 0) {
            c.itemGuardado = null; // Perdeu o presente após 12s!
            if (c.conn) c.conn.send({ tipo: 'item_atualizado', item: null, tempo: 0 });
          } else if (c.itemTempoRestante % 30 === 0 && c.conn) {
            c.conn.send({
              tipo: 'item_atualizado',
              item: c.itemGuardado,
              tempo: Math.ceil(c.itemTempoRestante / 60)
            });
          }
        }

        // Cálculo de velocidade real (para ultrapassar ou ficar para trás na pista!)
        if (c.paradoBatidaTimer > 0 || c.congeladoTimer > 0) {
          c.velocidadeAtual = 0; // Fica parado por 3s!
        } else {
          let velAlvo = c.char.velMax;
          if (c.freiando) velAlvo *= 0.45;
          if (c.turboTimer > 0) velAlvo *= 1.48; // Turbo dispara na frente!
          c.velocidadeAtual += (velAlvo - c.velocidadeAtual) * 0.08;
        }

        c.distancia += c.velocidadeAtual * 0.35;

        // Troca de pista / movimento lateral
        if (c.paradoBatidaTimer <= 0 && c.congeladoTimer <= 0 && c.travaDirecaoTimer <= 0) {
          c.xNorm += c.vx * (0.016 * c.char.agilidade);
          c.xNorm = Math.max(-0.82, Math.min(0.82, c.xNorm));
        }

        // Física do Pulo
        if (c.pulando) {
          c.alturaPulo += c.velPulo;
          c.velPulo -= 0.85;
          if (c.alturaPulo > 95) {
            c.alturaPulo = 95;
            if (c.velPulo > 0) c.velPulo = 0;
          }
          if (c.alturaPulo <= 0) {
            c.alturaPulo = 0;
            c.velPulo = 0;
            c.pulando = false;
          }
        }

        // Profundidade visual dinâmica (zKart) baseada na diferença de distância:
        // Quem ultrapassa vai mais para frente na pista (z menor), quem para na batida fica para trás (z maior)!
        const diffDist = c.distancia - mediaDistancia;
        c.zVisual = Math.max(0.56, Math.min(0.93, 0.80 - (diffDist * 0.008)));

        // Colisões com Presentes e Obstáculos na profundidade atual do kart
        for (let i = objetosPista.length - 1; i >= 0; i--) {
          const obj = objetosPista[i];
          if (Math.abs(obj.z - c.zVisual) < 0.05 && Math.abs(obj.xNorm - c.xNorm) < 0.17) {
            if (obj.tipo === 'caixa') {
              tocarSom('item');
              objetosPista.splice(i, 1);
              const sorteado = PODERES_DISPONIVEIS[Math.floor(Math.random() * PODERES_DISPONIVEIS.length)];
              c.itemGuardado = sorteado;
              c.itemTempoRestante = 12 * 60; // 12 segundos limite!
              if (c.conn) {
                c.conn.send({ tipo: 'item_atualizado', item: sorteado, tempo: 12 });
              }
            } else if (obj.tipo === 'obstaculo') {
              // Se não pulou alto o suficiente, bate e para por 3 segundos!
              if (c.alturaPulo < 22 && c.paradoBatidaTimer <= 0) {
                tocarSom('batida');
                objetosPista.splice(i, 1);
                c.paradoBatidaTimer = 55; // 3 segundos parado!
              }
            }
          }
        }

        // Atualiza status no quadrante da câmera correspondente
        const statusEl = document.getElementById(`status-quadrante-${c.jogadorIdx}`);
        if (statusEl) {
          if (c.paradoBatidaTimer > 0) {
            statusEl.innerText = `💥 BATEU! Parado por ${(c.paradoBatidaTimer / 60).toFixed(1)}s`;
          } else if (c.congeladoTimer > 0) {
            statusEl.innerText = `❄️ CONGELADO! ${(c.congeladoTimer / 60).toFixed(1)}s`;
          } else if (c.itemGuardado) {
            statusEl.innerText = `✋ ABRA A PALMA! ${c.itemGuardado.nome} (${Math.ceil(c.itemTempoRestante / 60)}s)`;
          } else if (c.turboTimer > 0) {
            statusEl.innerText = `🚀 TURBO ATIVO!`;
          } else {
            statusEl.innerText = `${Math.floor(c.distancia)}m • Inclinar cabeça p/ trocar faixa`;
          }
        }
      });

      // Ordena karts do mais distante (mais à frente na pista) para o mais próximo antes de desenhar
      const kartsParaDesenhar = [...corredores].sort((a, b) => a.zVisual - b.zVisual);

      kartsParaDesenhar.forEach((c) => {
        const projC = projetar3D(c.xNorm, c.zVisual);
        const s = projC.escala;

        const raioSombraX = Math.max(8, (34 - c.alturaPulo * 0.2) * s);
        const raioSombraY = Math.max(4, (13 - c.alturaPulo * 0.08) * s);
        ctxPista.beginPath();
        ctxPista.ellipse(projC.x, projC.y + 16 * s, raioSombraX, raioSombraY, 0, 0, Math.PI * 2);
        ctxPista.fillStyle = 'rgba(0,0,0,0.38)';
        ctxPista.fill();

        const drawY = projC.y - (c.alturaPulo * s);
        const escalaPulo = s * (1 + c.alturaPulo * 0.008);

        ctxPista.save();
        ctxPista.translate(projC.x, drawY);
        ctxPista.scale(escalaPulo, escalaPulo);

        // Efeitos visuais no Kart
        if (c.congeladoTimer > 0) {
          ctxPista.beginPath();
          ctxPista.arc(0, 0, 42, 0, Math.PI * 2);
          ctxPista.fillStyle = 'rgba(56, 189, 248, 0.6)';
          ctxPista.fill();
        } else if (c.paradoBatidaTimer > 0) {
          ctxPista.font = '28px sans-serif';
          ctxPista.fillText('💥', 0, -34);
        }

        if (c.turboTimer > 0) {
          ctxPista.font = '24px sans-serif';
          ctxPista.fillText('🔥', -14, 28);
          ctxPista.fillText('🔥', 14, 28);
        }

        // Trenó / Kart 3D
        ctxPista.fillStyle = c.cor;
        ctxPista.beginPath();
        ctxPista.roundRect(-30, -4, 60, 25, 10);
        ctxPista.fill();
        ctxPista.strokeStyle = '#ffd700';
        ctxPista.lineWidth = 3;
        ctxPista.stroke();

        ctxPista.fillStyle = '#e2e8f0';
        ctxPista.fillRect(-26, 21, 9, 6);
        ctxPista.fillRect(17, 21, 9, 6);

        ctxPista.font = '40px sans-serif';
        ctxPista.textAlign = 'center';
        ctxPista.fillText(c.char.icone, 0, -6);

        // Placa com Nome
        ctxPista.fillStyle = 'rgba(6, 24, 38, 0.88)';
        ctxPista.beginPath();
        ctxPista.roundRect(-36, 28, 72, 18, 6);
        ctxPista.fill();
        ctxPista.font = 'bold 11px sans-serif';
        ctxPista.fillStyle = '#ffd700';
        ctxPista.fillText(`P${c.jogadorIdx + 1} ${c.nome.substring(0, 8)}`, 0, 41);

        ctxPista.restore();
      });

      atualizarHUDCorrida();
      requestAnimationFrame(loopPrincipalPista);
    }

    function encerrarCorrida() {
      corridaAtiva = false;
      clearInterval(timerCorrida);
      tocarSom('vitoria');

      const ranking = [...corredores].sort((a, b) => b.distancia - a.distancia);
      const medalhas = ['🥇 1º LUGAR', '🥈 2º LUGAR', '🥉 3º LUGAR', '🏅 4º LUGAR'];

      const podioEl = document.getElementById('podio-resultado');
      podioEl.style.display = 'block';
      podioEl.innerHTML = `
        <h3 style="color:#ffd700; font-size:1.8rem; margin-bottom:10px;">🏆 PÓDIO FINAL 🏆</h3>
        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
          ${ranking.map((r, i) => `
            <div style="background:rgba(0,0,0,0.78); border:3px solid ${r.cor}; border-radius:16px; padding:12px 18px; min-width:155px;">
              <div style="font-weight:900; color:#ffd700; font-size:1.05rem;">${medalhas[i]}</div>
              <div style="font-size:2.6rem; margin:5px 0;">${r.char.icone}</div>
              <div style="font-weight:bold; color:${r.cor}; font-size:1.05rem;">${r.nome}</div>
              <div style="font-size:0.85rem; color:#cbd5e1;">${r.char.nome}</div>
              <div style="font-size:0.9rem; color:#2ecc71; font-weight:bold; margin-top:4px;">${Math.floor(r.distancia)} metros</div>
            </div>
          `).join('')}
        </div>
      `;

      document.getElementById('overlay-titulo').innerText = '🏁 FIM DA CORRIDA!';
      document.getElementById('overlay-sub').innerText = 'Confira a classificação final do 1º ao 4º lugar!';
      overlayTela.style.display = 'flex';
    }
  </script>
