<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle • Batalha de Neve 📱⛄</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body {
      background: radial-gradient(circle at center, #143d59 0%, #061826 95%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }

    h1 { font-size: 1.3rem; color: #ffd700; margin-bottom: 2px; }
    .sub { font-size: 0.82rem; color: #cbd5e1; margin-bottom: 8px; }

    #tela-escolha { width: 100%; max-width: 420px; margin: auto; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #ffd700;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .grid-icones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .card-icon {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,215,0,0.3);
      border-radius: 12px;
      padding: 10px;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .card-icon.selecionado {
      border-color: #2ecc71;
      background: rgba(46, 204, 113, 0.3);
    }

    .btn-principal {
      width: 100%;
      background: #2ecc71;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 24px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(46, 204, 113, 0.5);
    }

    /* Tela de Controle Ativo */
    #tela-controle {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    #touchpad {
      flex: 1;
      background: rgba(15, 42, 66, 0.85);
      border: 4px dashed #ffd700;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
    }

    .btn-atirar {
      width: 100%;
      background: linear-gradient(135deg, #ff2a2a, #c41e3a);
      color: #fff;
      border: 3px solid #ffd700;
      padding: 22px;
      border-radius: 26px;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 42, 42, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-atirar:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="tela-escolha">
    <h1>⛄ BATALHA DE NEVE</h1>
    <p class="sub" id="status-conexao">Conectando à TV...</p>
    <input type="text" id="input-nome" placeholder="Seu Apelido..." maxlength="12">
    <div class="grid-icones" id="grid-icones"></div>
    <button class="btn-principal" onclick="entrarArena()">🎮 ENTRAR NA ARENA</button>
  </div>

  <div id="tela-controle">
    <div>
      <h1 id="titulo-jogador" style="font-size:1.1rem;">BATALHA DE NEVE</h1>
      <p class="sub">Arraste o dedo no painel para mover a mira na TV e aperte o botão!</p>
    </div>

    <div id="touchpad">
      <div style="font-size:2.8rem;">🎯</div>
      <div style="font-size:0.9rem; font-weight:bold; color:#ffd700; margin-top:6px;">PAINEL DE MIRA</div>
    </div>

    <button class="btn-atirar" onclick="atirarBolaDeNeve()">❄️ ATIRAR BOLA DE NEVE!</button>
  </div>

  <script>
    const ICONES = ['🎅', '🤶', '🦌', '⛄', '🧝', '💚', '🐧', '🐻‍❄️'];
    let iconeSelecionado = '🎅';
    let meuSlot = 0;
    let connTV = null;

    const gridEl = document.getElementById('grid-icones');
    ICONES.forEach((ico, idx) => {
      const d = document.createElement('div');
      d.className = 'card-icon' + (idx === 0 ? ' selecionado' : '');
      d.innerText = ico;
      d.onclick = () => {
        iconeSelecionado = ico;
        document.querySelectorAll('.card-icon').forEach(c => c.classList.remove('selecionado'));
        d.classList.add('selecionado');
      };
      gridEl.appendChild(d);
    });

    const params = new URLSearchParams(window.location.search);
    const salaId = params.get('sala');
    const peer = new Peer();

    peer.on('open', () => {
      if (!salaId) {
        document.getElementById('status-conexao').innerText = '⚠️ Abra este link pelo QR Code da TV!';
        return;
      }
      connTV = peer.connect(salaId);
      connTV.on('open', () => {
        document.getElementById('status-conexao').innerText = '🟢 Conectado à TV! Escolha seu nome e ícone:';
      });

      connTV.on('data', (msg) => {
        if (msg.tipo === 'confirmado') {
          meuSlot = msg.slot;
          document.getElementById('touchpad').style.borderColor = msg.cor;
          document.getElementById('titulo-jogador').style.color = msg.cor;
        } else if (msg.tipo === 'sala_cheia') {
          alert('Sala cheia na TV!');
        }
      });
    });

    function entrarArena() {
      const nome = document.getElementById('input-nome').value.trim() || 'Guerreiro';
      document.getElementById('tela-escolha').style.display = 'none';
      document.getElementById('tela-controle').style.display = 'flex';

      if (connTV && connTV.open) {
        connTV.send({ tipo: 'entrar', nome, icone: iconeSelecionado });
      }
    }

    const touchpad = document.getElementById('touchpad');
    touchpad.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = touchpad.getBoundingClientRect();
      const touch = e.touches[0];
      const relX = (touch.clientX - rect.left) / rect.width;
      const relY = (touch.clientY - rect.top) / rect.height;

      const tvAimX = Math.max(80, Math.min(1020, relX * 1100));
      const tvAimY = Math.max(60, Math.min(480, relY * 540));

      if (connTV && connTV.open) {
        connTV.send({ tipo: 'mover_aim', slot: meuSlot, x: tvAimX, y: tvAimY });
      }
    }, { passive: false });

    touchpad.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) {
        const rect = touchpad.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width;
        const relY = (e.clientY - rect.top) / rect.height;
        const tvAimX = Math.max(80, Math.min(1020, relX * 1100));
        const tvAimY = Math.max(60, Math.min(480, relY * 540));

        if (connTV && connTV.open) {
          connTV.send({ tipo: 'mover_aim', slot: meuSlot, x: tvAimX, y: tvAimY });
        }
      }
    });

    function atirarBolaDeNeve() {
      if (connTV && connTV.open) {
        connTV.send({ tipo: 'atirar', slot: meuSlot });
      }
    }
  </script>
</body>
</html>
