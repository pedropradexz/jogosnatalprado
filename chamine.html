<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acerte a Chaminé 🎯🎁 - TV</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #0f2e47 0%, #04101a 95%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      border: 10px solid transparent;
      border-image: repeating-linear-gradient(45deg, #ffd700, #ffd700 20px, #c41e3a 20px, #c41e3a 40px) 10;
    }

    .pisca-pisca {
      width: 100%; display: flex; justify-content: space-around; padding: 4px 16px; z-index: 4; flex-shrink: 0;
    }
    .luz {
      width: 12px; height: 18px; border-radius: 50%;
      animation: piscar 0.8s infinite alternate;
    }
    .luz:nth-child(4n+1) { background: #ff2a2a; box-shadow: 0 0 12px #ff2a2a; }
    .luz:nth-child(4n+2) { background: #ffd700; box-shadow: 0 0 12px #ffd700; animation-delay: 0.2s; }
    .luz:nth-child(4n+3) { background: #2ecc71; box-shadow: 0 0 12px #2ecc71; animation-delay: 0.4s; }
    .luz:nth-child(4n+4) { background: #3498db; box-shadow: 0 0 12px #3498db; animation-delay: 0.6s; }

    @keyframes piscar {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    header { z-index: 4; width: 96%; flex-shrink: 0; }
    h1 { font-size: 1.5rem; color: #ffd700; text-shadow: 0 3px 8px rgba(0,0,0,0.85); }

    .hud-superior {
      display: flex; justify-content: space-around; align-items: center;
      margin-top: 4px; background: rgba(0,0,0,0.65); padding: 6px 16px;
      border-radius: 16px; border: 2px solid #ffd700; font-size: 0.95rem; font-weight: bold;
    }

    #container-arena {
      position: relative;
      width: 96vw;
      height: calc(100vh - 125px);
      margin: auto;
      border: 4px solid #ffd700;
      border-radius: 18px;
      overflow: hidden;
      background: #091c2e;
      box-shadow: 0 8px 30px rgba(0,0,0,0.85);
      z-index: 10;
    }

    #canvas-jogo { width: 100%; height: 100%; display: block; }

    #overlay-tela {
      display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(6, 24, 38, 0.98); z-index: 30; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px; text-align: center;
    }

    #overlay-tela h2 { font-size: 2.3rem; color: #ffd700; margin-bottom: 8px; text-shadow: 0 4px 12px rgba(0,0,0,0.8); }
    .sub-selecao { font-size: 1rem; color: #e2e8f0; margin-bottom: 16px; max-width: 700px; }

    #painel-conexao {
      display: flex; gap: 24px; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55); border: 3px solid #ffd700; border-radius: 20px;
      padding: 16px 24px; margin-bottom: 16px; flex-wrap: wrap; max-width: 900px;
    }

    #qrcode-box { background: #ffffff; padding: 10px; border-radius: 12px; }

    #lista-slots-lobby {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; min-width: 320px;
    }

    .slot-lobby {
      background: rgba(255,255,255,0.07); border: 2px dashed #64748b;
      border-radius: 12px; padding: 10px 14px; text-align: left;
    }
    .slot-lobby.pronto { border-style: solid; background: rgba(46, 204, 113, 0.16); }

    .btn-acao {
      background: #2ecc71; color: #fff; border: none; padding: 14px 38px;
      font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transition: transform 0.2s;
    }
    .btn-acao:hover { transform: scale(1.05); background: #27ae60; }
    .btn-acao:disabled { background: #475569; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

  <div class="pisca-pisca" id="luzes-topo"></div>

  <header>
    <h1>🎯 ACERTE A CHAMINÉ • MIRA LASER 🎁</h1>
    <div class="hud-superior">
      <div>TEMPO: <span id="tempo-valor" style="color:#3498db;">60</span>s</div>
      <div id="hud-placar">Aguardando jogadores...</div>
    </div>
  </header>

  <div id="container-arena">
    <canvas id="canvas-jogo" width="1100" height="520"></canvas>
  </div>

  <div class="pisca-pisca" id="luzes-base"></div>

  <div id="overlay-tela">
    <h2 id="overlay-titulo">🎯 ACERTE A CHAMINÉ</h2>
    <p class="sub-selecao">Escaneie o QR code com o telemóvel para conectar, mexa a mira na tela do telemóvel e atire presentes nas chaminés!</p>

    <div id="painel-conexao">
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div id="qrcode-box"></div>
        <div id="link-controle" style="font-size:0.75rem; color:#ffd700; max-width:220px; word-break:break-all;">Gerando sala...</div>
        <button onclick="copiarLink()" style="background:#3498db; color:#fff; border:none; padding:4px 10px; border-radius:8px; cursor:pointer; font-size:0.78rem; font-weight:bold;">📋 Copiar Link</button>
      </div>
      <div id="lista-slots-lobby"></div>
    </div>

    <div id="podio-resultado" style="display:none; margin-bottom:16px;"></div>
    <button class="btn-acao" id="btn-iniciar" onclick="iniciarJogo()" disabled>⏳ AGUARDANDO JOGADORES...</button>
  </div>

  <script>
    function criarLuzes(id) {
      const el = document.getElementById(id);
      for (let i = 0; i < 16; i++) {
        const l = document.createElement('div'); l.className = 'luz'; el.appendChild(l);
      }
    }
    criarLuzes('luzes-topo');
    criarLuzes('luzes-base');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarSom(tipo) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const agora = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (tipo === 'atirar') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, agora);
        osc.frequency.exponentialRampToValueAtTime(150, agora + 0.15);
        gain.gain.setValueAtTime(0.2, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.18);
        osc.start(agora); osc.stop(agora + 0.18);
      } else if (tipo === 'acerto') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, agora);
        osc.frequency.setValueAtTime(800, agora + 0.1);
        gain.gain.setValueAtTime(0.3, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.3);
        osc.start(agora); osc.stop(agora + 0.3);
      } else if (tipo === 'vitoria') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, agora);
        osc.frequency.setValueAtTime(659.25, agora + 0.15);
        osc.frequency.setValueAtTime(783.99, agora + 0.3);
        gain.gain.setValueAtTime(0.3, agora);
        gain.gain.exponentialRampToValueAtTime(0.01, agora + 0.7);
        osc.start(agora); osc.stop(agora + 0.7);
      }
    }

    const CORES_JOGADORES = ['#ff2a2a', '#2ecc71', '#3498db', '#ffd700'];
    const ICONES_CHARS = ['🎅', '🤶', '🦌', '⛄'];

    let jogadoresConectados = [];
    let chaminés = [];
    let presentesAtirados = [];
    let jogoAtivo = false;
    let tempoRestante = 60;
    let timerJogo = null;

    const canvas = document.getElementById('canvas-jogo');
    const ctx = canvas.getContext('2d');
    const overlayTela = document.getElementById('overlay-tela');

    const salaId = 'CHAM-' + Math.random().toString(36).substring(2, 7).toUpperCase();
    const peer = new Peer(salaId);
    let urlControle = '';

    peer.on('open', (id) => {
      const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      urlControle = `${baseHref}chamine_controle.html?sala=${id}`;
      document.getElementById('link-controle').innerText = urlControle;

      const qrEl = document.getElementById('qrcode-box');
      qrEl.innerHTML = '';
      new QRCode(qrEl, { text: urlControle, width: 140, height: 140, colorDark: '#061826', colorLight: '#ffffff' });
    });

    function copiarLink() {
      if (!urlControle) return;
      navigator.clipboard.writeText(urlControle);
      alert('✅ Link copiado!');
    }

    peer.on('connection', (conn) => {
      conn.on('data', (msg) => {
        if (msg.tipo === 'entrar') {
          if (jogadoresConectados.length >= 4) {
            conn.send({ tipo: 'sala_cheia' });
            return;
          }
          const slot = jogadoresConectados.length;
          const novo = {
            slot, peerId: conn.peer,
            nome: msg.nome || `Jogador ${slot + 1}`,
            icone: msg.icone || ICONES_CHARS[slot],
            cor: CORES_JOGADORES[slot],
            conn, pontinhos: 0,
            cursorX: canvas.width / 2,
            cursorY: canvas.height / 2
          };
          jogadoresConectados.push(novo);
          conn.send({ tipo: 'confirmado', slot, cor: novo.cor });
          atualizarLobby();
        } else if (msg.tipo === 'mudar_mira' && jogoAtivo) {
          const j = jogadoresConectados.find(x => x.slot === msg.slot);
          if (j) {
            j.cursorX = msg.x;
            j.cursorY = msg.y;
          }
        } else if (msg.tipo === 'atirar' && jogoAtivo) {
          const j = jogadoresConectados.find(x => x.slot === msg.slot);
          if (j) {
            tocarSom('atirar');
            presentesAtirados.push({
              x: j.cursorX, y: j.cursorY,
              slot: j.slot, cor: j.cor
            });
          }
        }
      });

      conn.on('close', () => {
        jogadoresConectados = jogadoresConectados.filter(j => j.conn !== conn);
        atualizarLobby();
      });
    });

    function atualizarLobby() {
      const listaEl = document.getElementById('lista-slots-lobby');
      listaEl.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const j = jogadoresConectados[i];
        const div = document.createElement('div');
        div.className = 'slot-lobby' + (j ? ' pronto' : '');
        div.style.borderColor = CORES_JOGADORES[i];
        div.innerHTML = j ? `<div style="color:${CORES_JOGADORES[i]}; font-weight:bold;">P${i+1} • ${j.icone} ${j.nome}</div>` : `<div style="color:#64748b;">P${i+1} • Vago</div>`;
        listaEl.appendChild(div);
      }
      const btn = document.getElementById('btn-iniciar');
      if (jogadoresConectados.length > 0) {
        btn.disabled = false;
        btn.innerText = `🎯 INICIAR (${jogadoresConectados.length} JOGADORES)`;
      } else {
        btn.disabled = true;
        btn.innerText = '⏳ AGUARDANDO JOGADORES...';
      }
      atualizarHUD();
    }

    function atualizarHUD() {
      document.getElementById('hud-placar').innerHTML = jogadoresConectados.map(j => `<span style="color:${j.cor}; margin:0 8px;">${j.icone} ${j.nome}: <b>${j.pontinhos}</b></span>`).join(' | ') || 'Conecte-se para jogar!';
    }

    function iniciarJogo() {
      overlayTela.style.display = 'none';
      tempoRestante = 60;
      document.getElementById('tempo-valor').innerText = tempoRestante;
      jogadoresConectados.forEach(j => j.pontinhos = 0);
      chaminés = [
        { x: 200, y: 320, w: 70, h: 90, velocidade: 2 },
        { x: 550, y: 240, w: 70, h: 90, velocidade: -2.5 },
        { x: 900, y: 300, w: 70, h: 90, velocidade: 1.8 }
      ];
      presentesAtirados = [];
      jogoAtivo = true;

      if (timerJogo) clearInterval(timerJogo);
      timerJogo = setInterval(() => {
        if (!jogoAtivo) return;
        tempoRestante--;
        document.getElementById('tempo-valor').innerText = tempoRestante;
        if (tempoRestante <= 0) encerrarJogo();
      }, 1000);

      requestAnimationFrame(loopPrincipal);
    }

    function loopPrincipal() {
      if (!jogoAtivo) return;
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Fundo Noite de Natal com telhados
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a192f');
      grad.addColorStop(1, '#1b3b5f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Telhados
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.moveTo(0, H); ctx.lineTo(0, 380); ctx.lineTo(350, 260); ctx.lineTo(700, 380); ctx.lineTo(1100, 240); ctx.lineTo(W, H);
      ctx.fill();

      // Chaminés movendo-se
      chaminés.forEach(c => {
        c.x += c.velocidade;
        if (c.x < 50 || c.x > W - 120) c.velocidade *= -1;

        ctx.fillStyle = '#78350f';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(c.x - 8, c.y - 12, c.w + 16, 16);
      });

      // Presentes atirados
      for (let i = presentesAtirados.length - 1; i >= 0; i--) {
        const p = presentesAtirados[i];
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🎁', p.x, p.y);

        // Checar colisão com chaminés
        let acertou = false;
        for (let c of chaminés) {
          if (p.x > c.x && p.x < c.x + c.w && p.y > c.y - 15 && p.y < c.y + c.h) {
            acertou = true;
            const j = jogadoresConectados.find(x => x.slot === p.slot);
            if (j) { j.pontinhos += 100; atualizarHUD(); }
            tocarSom('acerto');
            break;
          }
        }
        if (acertou || p.y < 0) {
          presentesAtirados.splice(i, 1);
        }
      }

      // Cursores de mira dos jogadores na TV
      jogadoresConectados.forEach(j => {
        ctx.strokeStyle = j.cor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(j.cursorX, j.cursorY, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = j.cor;
        ctx.fillRect(j.cursorX - 2, j.cursorY - 8, 4, 16);
        ctx.fillRect(j.cursorX - 8, j.cursorY - 2, 16, 4);
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(`P${j.slot + 1} (${j.icone})`, j.cursorX, j.cursorY - 22);
      });

      requestAnimationFrame(loopPrincipal);
    }

    function encerrarJogo() {
      jogoAtivo = false;
      clearInterval(timerJogo);
      tocarSom('vitoria');

      const ranking = [...jogadoresConectados].sort((a, b) => b.pontinhos - a.pontinhos);
      const podio = document.getElementById('podio-resultado');
      podio.style.display = 'block';
      podio.innerHTML = `
        <h3 style="color:#ffd700; font-size:1.8rem; margin-bottom:10px;">🏆 FIM DE JOGO! 🏆</h3>
        <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
          ${ranking.map((r, i) => `
            <div style="background:rgba(0,0,0,0.8); border:3px solid ${r.cor}; border-radius:16px; padding:12px 20px; min-width:140px;">
              <div style="font-size:2rem;">${r.icone}</div>
              <div style="font-weight:bold; color:${r.cor};">${r.nome}</div>
              <div style="font-size:1.1rem; color:#2ecc71; font-weight:bold; margin-top:4px;">${r.pontinhos} pts</div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('overlay-titulo').innerText = '🎯 FIM DE JOGO!';
      overlayTela.style.display = 'flex';
      document.getElementById('btn-iniciar').innerText = '🔄 JOGAR NOVAMENTE';
    }
  </script>
</body>
</html>
