<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle • Destrua o Biscoito 📱</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      background: radial-gradient(circle at center, #2c1a0f 0%, #0d0603 95%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      text-align: center;
    }

    h1 { font-size: 1.2rem; color: #ffd700; margin-bottom: 2px; }
    .sub { font-size: 0.78rem; color: #cbd5e1; margin-bottom: 10px; }

    #tela-escolha { width: 100%; max-width: 400px; margin: auto; }
    input[type="text"] {
      width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ffd700;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; text-align: center;
    }

    .grid-icones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .card-icon {
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,215,0,0.3);
      border-radius: 12px; padding: 12px; font-size: 1.8rem; cursor: pointer;
    }
    .card-icon.selecionado { border-color: #2ecc71; background: rgba(46, 204, 113, 0.3); }

    .btn-principal {
      width: 100%; background: #2ecc71; color: #fff; border: none; padding: 14px;
      border-radius: 24px; font-size: 1.1rem; font-weight: 900; cursor: pointer;
    }

    #tela-controle {
      display: none; width: 100%; height: 100%; flex-direction: column; justify-content: space-between; gap: 12px;
    }

    .btn-atacar {
      flex: 1;
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff; border: 4px solid #ffd700; border-radius: 24px;
      font-size: 1.5rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 25px rgba(217, 119, 6, 0.6);
      text-transform: uppercase;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
    }
    .btn-atacar:active { transform: scale(0.96); filter: brightness(1.2); }

    .btn-especial {
      background: linear-gradient(135deg, #ff2a2a, #c41e3a);
      border-color: #fff;
      box-shadow: 0 6px 25px rgba(255, 42, 42, 0.6);
      font-size: 1.2rem;
      flex: 0.6;
    }
  </style>
</head>
<body>

  <div id="tela-escolha">
    <h1>🍪 DESTRUA O BISCOITO</h1>
    <p class="sub" id="status-conexao">Conectando à TV...</p>
    <input type="text" id="input-nome" placeholder="Seu Apelido..." maxlength="12">
    <div class="grid-icones" id="grid-icones"></div>
    <button class="btn-principal" onclick="entrar()">ENTRAR NA BATALHA</button>
  </div>

  <div id="tela-controle">
    <div>
      <h1 id="titulo-jogador">BATALHA DE GENGIBRE</h1>
      <p class="sub">Toque sem parar para atacar o biscoito!</p>
    </div>

    <button class="btn-atacar" onclick="atacar(false)">
      <div style="font-size: 3.5rem;">👊</div>
      <div>SOCO DE AÇÚCAR!</div>
    </button>

    <button class="btn-atacar btn-especial" onclick="atacar(true)">
      <div style="font-size: 2.5rem;">💣</div>
      <div>BOMBA DE GLACÊ!</div>
    </button>
  </div>

  <script>
    const ICONES = ['🎅', '🤶', '🦌', '⛄'];
    let iconeSel = '🎅';
    let meuSlot = 0;
    let connTV = null;

    const grid = document.getElementById('grid-icones');
    ICONES.forEach((ico, idx) => {
      const d = document.createElement('div');
      d.className = 'card-icon' + (idx === 0 ? ' selecionado' : '');
      d.innerText = ico;
      d.onclick = () => {
        iconeSel = ico;
        document.querySelectorAll('.card-icon').forEach(c => c.classList.remove('selecionado'));
        d.classList.add('selecionado');
      };
      grid.appendChild(d);
    });

    const params = new URLSearchParams(window.location.search);
    const salaId = params.get('sala');
    const peer = new Peer();

    peer.on('open', () => {
      if (!salaId) {
        document.getElementById('status-conexao').innerText = '⚠️ Abra este link pelo QR Code da TV!';
        return;
      }
      connTV = peer.connect(salaId);
      connTV.on('open', () => {
        document.getElementById('status-conexao').innerText = '🟢 Conectado! Escolha seu nome e ícone:';
      });

      connTV.on('data', (msg) => {
        if (msg.tipo === 'confirmado') {
          meuSlot = msg.slot;
        } else if (msg.tipo === 'sala_cheia') {
          alert('Sala cheia na TV!');
        }
      });
    });

    function entrar() {
      const nome = document.getElementById('input-nome').value.trim() || 'Guerreiro';
      document.getElementById('tela-escolha').style.display = 'none';
      document.getElementById('tela-controle').style.display = 'flex';
      if (connTV && connTV.open) {
        connTV.send({ tipo: 'entrar', nome, icone: iconeSel });
      }
    }

    function atacar(especial) {
      if (connTV && connTV.open) {
        connTV.send({ tipo: 'atacar', slot: meuSlot, especial });
      }
    }
  </script>
</body>
</html>
