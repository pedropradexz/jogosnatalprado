<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle • Guerra de Biscoitos 📱</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      background: radial-gradient(circle at center, #2c1a0f 0%, #0d0603 95%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      text-align: center;
    }

    h1 { font-size: 1.1rem; color: #ffd700; margin-bottom: 2px; }
    .sub { font-size: 0.78rem; color: #cbd5e1; margin-bottom: 10px; }

    #tela-escolha { width: 100%; max-width: 400px; margin: auto; }
    input[type="text"] {
      width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ffd700;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; text-align: center;
    }

    .grid-equipes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card-equipe {
      background: rgba(255,255,255,0.08); border: 3px solid rgba(255,215,0,0.3);
      border-radius: 14px; padding: 16px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    .card-equipe.vermelha.selecionado { border-color: #ff2a2a; background: rgba(196, 30, 58, 0.4); }
    .card-equipe.azul.selecionado { border-color: #3b82f6; background: rgba(59, 130, 246, 0.4); }

    .btn-principal {
      width: 100%; background: #2ecc71; color: #fff; border: none; padding: 14px;
      border-radius: 24px; font-size: 1.1rem; font-weight: 900; cursor: pointer;
    }

    #tela-controle {
      display: none; width: 100%; height: 100%; flex-direction: column; justify-content: space-between; gap: 10px;
    }

    .btn-acao-jogo {
      flex: 1;
      border: 4px solid #ffd700; border-radius: 20px;
      font-size: 1.2rem; font-weight: 900; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
      color: #fff; text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .btn-acao-jogo:active { transform: scale(0.96); filter: brightness(1.2); }

    .btn-glace { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .btn-biscoito { background: linear-gradient(135deg, #d97706, #b45309); }
    .btn-escudo { background: linear-gradient(135deg, #10b981, #059669); font-size: 1rem; flex: 0.7; }
  </style>
</head>
<body>

  <div id="tela-escolha">
    <h1>🏰 GUERRA DE BISCOITOS</h1>
    <p class="sub" id="status-conexao">Conectando à TV...</p>
    <input type="text" id="input-nome" placeholder="Seu Apelido..." maxlength="12">
    
    <div class="grid-equipes">
      <div class="card-equipe vermelha selecionado" onclick="escolherEquipa('vermelha')">
        <div style="font-size: 2rem;">🔴</div>
        Equipa Vermelha
      </div>
      <div class="card-equipe azul" onclick="escolherEquipa('azul')">
        <div style="font-size: 2rem;">🔵</div>
        Equipa Azul
      </div>
    </div>

    <button class="btn-principal" onclick="entrar()">ENTRAR NA BATALHA</button>
  </div>

  <div id="tela-controle">
    <div>
      <h1 id="titulo-equipa">BATALHA DE GENGIBRE</h1>
      <p class="sub">Toque nos botões para atacar a base inimiga ou defender a sua!</p>
    </div>

    <button class="btn-acao-jogo btn-glace" onclick="enviarAcao('glace')">
      <div style="font-size: 2.8rem;">❄️</div>
      <div>LANÇAR GLACÊ (RÁPIDO)</div>
    </button>

    <button class="btn-acao-jogo btn-biscoito" onclick="enviarAcao('biscoito')">
      <div style="font-size: 2.8rem;">🍪</div>
      <div>ATIRAR BISCOITOS (PESADO)</div>
    </button>

    <button class="btn-acao-jogo btn-escudo" onclick="enviarAcao('escudo')">
      <div style="font-size: 2rem;">🛡️</div>
      <div>ATIVAR ESCUDO DE AÇÚCAR</div>
    </button>
  </div>

  <script>
    let equipaSel = 'vermelha';
    let connTV = null;

    function escolherEquipa(eq) {
      equipaSel = eq;
      document.querySelectorAll('.card-equipe').forEach(c => c.classList.remove('selecionado'));
      if (eq === 'vermelha') {
        document.querySelector('.card-equipe.vermelha').classList.add('selecionado');
      } else {
        document.querySelector('.card-equipe.azul').classList.add('selecionado');
      }
    }

    const params = new URLSearchParams(window.location.search);
    const salaId = params.get('sala');
    const peer = new Peer();

    peer.on('open', () => {
      if (!salaId) {
        document.getElementById('status-conexao').innerText = '⚠️ Abra este link pelo QR Code da TV!';
        return;
      }
      connTV = peer.connect(salaId);
      connTV.on('open', () => {
        document.getElementById('status-conexao').innerText = '🟢 Conectado! Escolha seu nome e equipa:';
      });

      connTV.on('data', (msg) => {
        if (msg.tipo === 'confirmado') {
          // Confirmado
        }
      });
    });

    function entrar() {
      const nome = document.getElementById('input-nome').value.trim() || 'Guerreiro';
      document.getElementById('tela-escolha').style.display = 'none';
      document.getElementById('tela-controle').style.display = 'flex';
      
      const titulo = document.getElementById('titulo-equipa');
      if (equipaSel === 'vermelha') {
        titulo.innerText = '🔴 EQUIPA VERMELHA';
        titulo.style.color = '#ff2a2a';
      } else {
        titulo.innerText = '🔵 EQUIPA AZUL';
        titulo.style.color = '#3b82f6';
      }

      if (connTV && connTV.open) {
        connTV.send({ tipo: 'entrar', nome, equipa: equipaSel });
      }
    }

    function enviarAcao(acao) {
      if (connTV && connTV.open) {
        connTV.send({ tipo: 'acao', acao });
      }
    }
  </script>
</body>
</html>
